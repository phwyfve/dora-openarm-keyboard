# Isolated policy Python; reuse the working simulator and scene without IK.
exit_when_nodes_finish: true
nodes:
  - id: policy
    path: ..\.venv-inference\Scripts\python.exe
    args: "-u act-inference.py"
    inputs:
      tick:
        source: viewer/control_tick
        queue_size: 2
      state_right:
        source: viewer/state_right
        queue_size: 2
      state_left:
        source: viewer/state_left
        queue_size: 2
      camera_ceiling:
        source: viewer/camera_ceiling
        queue_size: 2
      camera_head_left:
        source: viewer/camera_head_left
        queue_size: 2
      camera_head_right:
        source: viewer/camera_head_right
        queue_size: 2
      camera_wrist_left:
        source: viewer/camera_wrist_left
        queue_size: 2
      camera_wrist_right:
        source: viewer/camera_wrist_right
        queue_size: 2
    outputs:
      - position_right
      - position_left

  - id: viewer
    path: ..\.venv\Scripts\dora-openarm-mujoco.exe
    args: "--scene demo --keyframe home --enable-collision --ctrl --render --viewer --sync-control 30"
    inputs:
      move_position_right:
        source: policy/position_right
        queue_size: 2
      move_position_left:
        source: policy/position_left
        queue_size: 2
      ui_tick:
        source: dora/timer/millis/50
        queue_size: 1
    outputs:
      - status
      - control_tick
      - state_right
      - state_left
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling
